name: Nix Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Build each check output. Dependencies substitute from cache.nixos.org where
      # available; the checks themselves compile on the runner.
      - name: Build check derivations
        shell: bash
        run: |
          set -euo pipefail
          check_list=$(nix eval --raw .#checks.x86_64-linux \
            --apply 'x: builtins.concatStringsSep "\n" (builtins.attrNames x)')
          mapfile -t check_names <<< "$check_list"
          if ((${#check_names[@]} == 0)); then
            echo "::error::No x86_64-linux flake checks were found"
            exit 1
          fi
          targets=()
          for check_name in "${check_names[@]}"; do
            targets+=(".#checks.x86_64-linux.${check_name}")
          done
          nix build --no-link "${targets[@]}"

      - name: Check flake
        run: nix flake check
