name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Check native checkpoint comparisons
        run: python3 -m unittest tests.test_checkpoint_exports -v

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-wheel:
    name: Build Python wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel once for every Python version
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --locked --out dist -i python3.12
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist/*.whl
          if-no-files-found: error

  python-bindings:
    name: Installed wheel tests
    needs: build-wheel
    uses: ./.github/workflows/test-wheels.yml
